<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJET ORION</title>
<style>
:root{--bg:#07111f;--panel:#101f33;--panel2:#172b43;--line:#29435e;--cyan:#45d9ff;--gold:#ffd166;--green:#65e6a5;--red:#ff6978;--text:#eaf4ff;--muted:#91a9c2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#142c49,#050b14 70%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{padding:18px 14px;text-align:center;background:#07101ddd;border-bottom:1px solid var(--line)}
h1{margin:0;color:var(--cyan);letter-spacing:4px;font-size:27px}
header p{margin:7px 0 0;color:var(--muted);font-size:12px}
.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;max-width:1100px;margin:auto}
.resource{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 4px;text-align:center;font-size:12px}
.resource b{display:block;color:var(--gold);font-size:16px;margin-top:5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px;max-width:1100px;margin:auto}
nav button{white-space:nowrap}
button{background:#183653;color:var(--text);border:1px solid #376184;padding:10px 13px;border-radius:7px;font-weight:bold;cursor:pointer}
button:hover{background:#245174}
button:disabled{opacity:.4;cursor:not-allowed}
button.active{background:#087ca0;border-color:var(--cyan)}
main{max-width:1100px;margin:auto;padding:10px}
.panel{background:#0e1c2eef;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
h2{color:var(--cyan);font-size:20px;margin:0 0 12px}
h3{color:var(--gold);font-size:15px;margin:5px 0 10px}
p{line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:9px}
.item p{font-size:13px;color:var(--muted);margin:7px 0}
.item button{width:100%;margin-top:8px}
.small{font-size:12px;color:var(--muted)}
.stat{font-size:13px;line-height:1.8}
.bar{height:8px;background:#26384c;border-radius:9px;overflow:hidden;margin:7px 0}
.bar span{display:block;height:100%;background:var(--cyan)}
input,select{background:#071321;color:white;border:1px solid var(--line);padding:9px;border-radius:6px;width:100%;margin:5px 0}
.log{font-size:12px;color:#b6cce0;border-bottom:1px solid #26384c;padding:7px 0}
.good{color:var(--green)}.bad{color:var(--red)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<h1>✦ PROJET ORION ✦</h1>
<p>UNIVERS GALACTIQUE — COMMANDANT, À VOUS DE JOUER</p>
</header>
<div class="resources" id="resources"></div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>PROJET ORION · Version 1.0 · Prototype stratégique</footer>

<script>
const SAVE="orionSave";
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n||0).toLocaleString("fr-FR");
const costs={
 mine:{metal:150,crystal:60},crystal:{metal:180,crystal:120},
 solar:{metal:120,crystal:50},shipyard:{metal:400,crystal:200},
 lab:{metal:600,crystal:400},habitat:{metal:300,crystal:200},
 deuterium:{metal:250,crystal:150}
};
const buildingNames={
 mine:"Mine de métal",crystal:"Mine de cristal",solar:"Centrale solaire",
 shipyard:"Chantier spatial",lab:"Laboratoire",habitat:"Habitat orbital",
 deuterium:"Extracteur de deutérium"
};
const researchData={
 energy:{name:"Technologie énergétique",metal:300,crystal:250,time:10,desc:"Améliore la production énergétique."},
 propulsion:{name:"Propulsion spatiale",metal:500,crystal:350,time:12,desc:"Débloque les vaisseaux avancés."},
 defense:{name:"Technologie défensive",metal:450,crystal:400,time:12,desc:"Améliore les défenses planétaires."}
};
const ships={
 OR1:{name:"OR-1 Éclaireur",metal:150,crystal:100,deuterium:20,time:10,desc:"Permet d'explorer la galaxie."},
 OR2:{name:"OR-2 Intercepteur",metal:350,crystal:200,deuterium:80,time:12,desc:"Vaisseau de combat."},
 OR3:{name:"OR-3 Colonisateur",metal:700,crystal:500,deuterium:250,time:15,desc:"Permet de coloniser une planète."},
 OR4:{name:"OR-4 Transporteur",metal:450,crystal:250,deuterium:100,time:12,desc:"Transporte les ressources entre colonies."}
};
const defenses={
 laser:{name:"Tourelle laser",metal:200,crystal:100,deuterium:0,time:8},
 shield:{name:"Bouclier planétaire",metal:500,crystal:400,deuterium:100,time:12}
};
const worlds=[
{id:"NOVA-01",name:"NOVA-01",coord:"1:1:1",system:"Solaria",cost:0,reward:0,time:0},
{id:"LYRA-02",name:"LYRA-02",coord:"1:1:2",system:"Solaria",cost:100,reward:500,time:10},
{id:"VEGA-03",name:"VEGA-03",coord:"1:1:3",system:"Solaria",cost:150,reward:400,time:12},
{id:"ORION-04",name:"ORION-04",coord:"1:2:1",system:"Solaria",cost:250,reward:600,time:15},
{id:"ZENITH-05",name:"ZENITH-05",coord:"1:2:2",system:"Solaria",cost:350,reward:800,time:20}
];
let game,tab="home",selected="NOVA-01";
function newPlanet(id){
return {id,metal:1500,crystal:1000,deuterium:400,energy:14,population:id==="NOVA-01"?250:100,
buildings:{mine:1,crystal:1,solar:1,shipyard:0,lab:0,habitat:0,deuterium:0},
ships:{OR1:0,OR2:0,OR3:0,OR4:0},defenses:{laser:0,shield:0}};
}
function fresh(){
let p=newPlanet("NOVA-01");p.ships.OR1=2;p.ships.OR2=1;
return {planets:[p],discovered:["NOVA-01"],research:{energy:0,propulsion:0,defense:0},
queue:[],missions:[],transports:[],logs:["Bienvenue commandant. Votre aventure commence sur NOVA-01."],
lastTick:Date.now()};
}
function load(){
try{
let s=JSON.parse(localStorage.getItem(SAVE));
if(!s)return fresh();
s.planets=s.planets||[newPlanet("NOVA-01")];
s.discovered=s.discovered||["NOVA-01"];
s.research=s.research||{energy:0,propulsion:0,defense:0};
s.queue=s.queue||[];s.missions=s.missions||[];s.transports=s.transports||[];
s.logs=s.logs||[];
s.planets.forEach(p=>{
let d=newPlanet(p.id);
p.buildings={...d.buildings,...p.buildings};
p.ships={...d.ships,...p.ships};
p.defenses={...d.defenses,...p.defenses};
p.population=Number(p.population)||(p.id==="NOVA-01"?250:100);
["metal","crystal","deuterium","energy"].forEach(k=>p[k]=Number(p[k])||0);
});
return s;
}catch(e){return fresh();}
}
game=load();
function save(){game.lastTick=Date.now();localStorage.setItem(SAVE,JSON.stringify(game))}
function planet(){return game.planets.find(p=>p.id===selected)||game.planets[0]}
function log(t){game.logs.unshift(new Date().toLocaleTimeString("fr-FR")+" — "+t);game.logs=game.logs.slice(0,35)}
function capacity(p){return 250+(p.buildings.habitat||0)*500}
function production(p){
return {metal:30*p.buildings.mine,crystal:15*p.buildings.crystal,
deuterium:4*p.buildings.deuterium,energy:14+10*p.buildings.solar+5*p.buildings.habitat}
}
function updateResources(){
game.planets.forEach(p=>{
let r=production(p);
p.metal+=r.metal/3600;p.crystal+=r.crystal/3600;
p.deuterium+=r.deuterium/3600;
p.population=Math.min(capacity(p),p.population+1/3600);
});
}
function spend(p,c){
for(let k of ["metal","crystal","deuterium"])if((p[k]||0)<(c[k]||0))return false;
for(let k of ["metal","crystal","deuterium"])p[k]-=c[k]||0;
return true;
}
function enqueue(label,time,planetId,action){
if(game.queue.length>=3){alert("La file de construction est pleine (3 maximum).");return false}
game.queue.push({id:Date.now()+Math.random(),label,time,remaining:time,planetId,action});
log(label+" lancé.");
return true;
}
function complete(q){
let p=game.planets.find(x=>x.id===q.planetId);
if(!p)return;
let a=q.action;
if(a.type==="building")p.buildings[a.key]++;
if(a.type==="research")game.research[a.key]++;
if(a.type==="ship")p.ships[a.key]=(p.ships[a.key]||0)+a.amount;
if(a.type==="defense")p.defenses[a.key]++;
log(q.label+" terminé sur "+p.id+".");
}
function build(key){
let p=planet(),level=p.buildings[key]||0,c={...costs[key]};
c.metal=Math.floor(c.metal*(1+level*.65));c.crystal=Math.floor(c.crystal*(1+level*.65));
if(game.queue.length>=3)return alert("File de construction pleine.");
if(!spend(p,c))return alert("Ressources insuffisantes.");
enqueue(buildingNames[key]+" niveau "+(level+1),6+level*2,p.id,{type:"building",key});
render();
}
function research(key){
let p=planet(),r=researchData[key],level=game.research[key];
if(p.buildings.lab<1)return alert("Construisez un laboratoire.");
if(game.queue.length>=3)return alert("File de construction pleine.");
let c={metal:r.metal*(level+1),crystal:r.crystal*(level+1)};
if(!spend(p,c))return alert("Ressources insuffisantes.");
enqueue(r.name+" niveau "+(level+1),r.time,p.id,{type:"research",key});
render();
}
function buildShip(key){
let p=planet(),s=ships[key],amount=Math.max(1,Math.min(20,Number($("count_"+key)?.value)||1));
if(p.buildings.shipyard<1)return alert("Construisez un chantier spatial.");
if(key==="OR3"&&game.research.propulsion<1)return alert("La propulsion est nécessaire.");
if(key==="OR4"&&game.research.propulsion<1)return alert("La propulsion est nécessaire.");
if(game.queue.length>=3)return alert("File de construction pleine.");
let c={metal:s.metal*amount,crystal:s.crystal*amount,deuterium:s.deuterium*amount};
if(!spend(p,c))return alert("Ressources insuffisantes.");
enqueue(s.name+" × "+amount,s.time*amount,p.id,{type:"ship",key,amount});
render();
}
function buildDefense(key){
let p=planet(),d=defenses[key];
if(game.queue.length>=3)return alert("File de construction pleine.");
if(!spend(p,d))return alert("Ressources insuffisantes.");
enqueue(d.name,d.time,p.id,{type:"defense",key});
render();
}
function explore(id){
let p=planet(),w=worlds.find(x=>x.id===id);
if(p.ships.OR1<1)return alert("Il faut un OR-1 éclaireur.");
if(game.discovered.includes(id))return alert("Cette planète est déjà découverte.");
if(!spend(p,{metal:w.cost}))return alert("Métal insuffisant.");
p.ships.OR1--;
game.queue.push({id:Date.now()+Math.random(),label:"Exploration "+id,time:w.time,remaining:w.time,planetId:p.id,action:{type:"explore",target:id}});
log("Exploration de "+id+" lancée.");
render();
}
function colonize(id){
let p=planet();
if(!game.discovered.includes(id))return alert("Planète non découverte.");
if(game.planets.some(x=>x.id===id))return alert("Cette planète est déjà colonisée.");
if(!p.ships.OR3)return alert("Il faut un OR-3 colonisateur.");
p.ships.OR3--;
let np=newPlanet(id);np.metal=500;np.crystal=300;np.deuterium=100;
game.planets.push(np);selected=id;
log(id+" a rejoint votre empire !");
render();
}
function sendTransport(){
let from=planet(),toId=$("targetPlanet").value,to=game.planets.find(p=>p.id===toId);
if(!to||to===from)return alert("Choisissez une autre planète.");
if(!from.ships.OR4)return alert("Il faut un OR-4 transporteur.");
let cargo={metal:Number($("cargoMetal").value)||0,crystal:Number($("cargoCrystal").value)||0,deuterium:Number($("cargoDeut").value)||0};
if(!cargo.metal&&!cargo.crystal&&!cargo.deuterium)return alert("Indiquez des ressources à transporter.");
if(!spend(from,cargo))return alert("Ressources insuffisantes.");
from.ships.OR4--;
game.transports.push({from:from.id,to:to.id,cargo,time:15,remaining:15});
log("Transport lancé vers "+to.id+".");
render();
}
function sendMission(){
let p=planet(),n=Math.max(1,Number($("attackCount").value)||1);
if(p.ships.OR2<n)return alert("Pas assez d'OR-2.");
p.ships.OR2-=n;
game.missions.push({planet:p.id,count:n,remaining:20});
log("Mission militaire envoyée vers un avant-poste pirate.");
render();
}
function finishQueue(q){
if(q.action.type==="explore"){
game.discovered.push(q.action.target);
let p=game.planets.find(x=>x.id===q.planetId);
if(p)p.metal+=worlds.find(w=>w.id===q.action.target).reward;
log(q.action.target+" découvert ! Récompense reçue.");
}else complete(q);
}
function tick(){
let now=Date.now(),delta=Math.min(5,(now-game.lastTick)/1000);
if(delta<=0)return;
updateResources();
game.queue.forEach(q=>q.remaining-=delta);
let done=game.queue.filter(q=>q.remaining<=0);
game.queue=game.queue.filter(q=>q.remaining>0);
done.forEach(finishQueue);
game.transports.forEach(t=>t.remaining-=delta);
let arrived=game.transports.filter(t=>t.remaining<=0);
game.transports=game.transports.filter(t=>t.remaining>0);
arrived.forEach(t=>{
let to=game.planets.find(p=>p.id===t.to),from=game.planets.find(p=>p.id===t.from);
if(to)Object.keys(t.cargo).forEach(k=>to[k]+=t.cargo[k]);
if(from)from.ships.OR4++;
log("Transport arrivé sur "+t.to+".");
});
game.missions.forEach(m=>m.remaining-=delta);
let finished=game.missions.filter(m=>m.remaining<=0);
game.missions=game.missions.filter(m=>m.remaining>0);
finished.forEach(m=>{
let p=game.planets.find(x=>x.id===m.planet);
let losses=Math.min(m.count,Math.floor(Math.random()*Math.max(1,m.count/2)));
let survivors=m.count-losses;
if(p)p.ships.OR2+=survivors;
if(p){p.metal+=m.count*100;p.crystal+=m.count*40;}
log("Mission terminée : "+survivors+" intercepteurs revenus, "+losses+" perdus. Butin récupéré.");
});
game.lastTick=now;save();render();
}
function renderResources(){
let p=planet();
$("resources").innerHTML=["metal","crystal","deuterium","energy"].map((k,i)=>
`<div class="resource">${["🔩 Métal","💎 Cristal","💧 Deutérium","⚡ Énergie"][i]}<b>${fmt(p[k])}</b></div>`).join("");
}
const tabs=[["home","Commandement"],["buildings","Bâtiments"],["research","Recherches"],["fleet","Flotte"],["defense","Défenses"],["galaxy","Galaxie"],["empire","Empire"],["transport","Transports"],["missions","Missions"],["logs","Journal"]];
function renderNav(){
$("nav").innerHTML=tabs.map(([id,name])=>`<button class="${tab===id?"active":""}" onclick="tab='${id}';render()">${name}</button>`).join("");
}
function card(title,desc,button){
return `<div class="item"><h3>${title}</h3><p>${desc}</p>${button}</div>`;
}
function queueHTML(){
return `<div class="panel"><h3>File de construction (${game.queue.length}/3)</h3>`+
(game.queue.length?game.queue.map(q=>`<div class="log">${q.label} — ${Math.ceil(q.remaining)} sec</div>`).join(""):"<p class='small'>Aucune construction en cours.</p>")+"</div>";
}
function home(){
let p=planet(),r=production(p);
return `<div class="panel"><h2>Commandement spatial</h2><p>Bienvenue commandant. Votre empire commence sur ${p.id}.</p>
<div class="grid">
<div class="item"><h3>🌍 Planète actuelle</h3><p>${p.id} · ${worlds.find(w=>w.id===p.id)?.coord||"?"}</p><p>Population : ${fmt(p.population)} / ${capacity(p)}</p></div>
<div class="item"><h3>📈 Production horaire</h3><p>Métal : ${fmt(r.metal)} / h</p><p>Cristal : ${fmt(r.crystal)} / h</p><p>Deutérium : ${fmt(r.deuterium)} / h</p></div>
<div class="item"><h3>👨‍🚀 Population</h3><div class="bar"><span style="width:${Math.min(100,p.population/capacity(p)*100)}%"></span></div><p>${Math.round(p.population/capacity(p)*100)} % de capacité occupée</p></div>
<div class="item"><h3>🚀 Flotte</h3><p>Éclaireurs : ${p.ships.OR1}</p><p>Intercepteurs : ${p.ships.OR2}</p><p>Colonisateurs : ${p.ships.OR3}</p><p>Transporteurs : ${p.ships.OR4}</p></div>
</div></div>${queueHTML()}`;
}
function buildings(){
let p=planet();
return `<div class="panel"><h2>🏗️ Bâtiments de ${p.id}</h2><div class="grid">`+
Object.keys(buildingNames).map(k=>{
let level=p.buildings[k],c=costs[k],cost={metal:Math.floor(c.metal*(1+level*.65)),crystal:Math.floor(c.crystal*(1+level*.65))};
return card(buildingNames[k]+" · Niveau "+level,
`Coût : ${fmt(cost.metal)} métal · ${fmt(cost.crystal)} cristal`,
`<button onclick="build('${k}')">Construire niveau ${level+1}</button>`);
}).join("")+"</div></div>"+queueHTML();
}
function research(){
let p=planet();
return `<div class="panel"><h2>🔬 Centre de recherche</h2><p>Laboratoire : niveau ${p.buildings.lab}</p><div class="grid">`+
Object.keys(researchData).map(k=>{
let r=researchData[k],lv=game.research[k];
return card(r.name+" · Niveau "+lv,r.desc+`<br>Coût : ${fmt(r.metal*(lv+1))} métal · ${fmt(r.crystal*(lv+1))} cristal`,
`<button onclick="research('${k}')">Développer</button>`);
}).join("")+"</div></div>"+queueHTML();
}
function fleet(){
let p=planet();
return `<div class="panel"><h2>🚀 Chantier spatial</h2><p>Chantier spatial niveau ${p.buildings.shipyard}</p><div class="grid">`+
Object.keys(ships).map(k=>{
let s=ships[k];
return card(s.name,`${s.desc}<br>En possession : ${p.ships[k]}<br>Coût unitaire : ${s.metal} métal · ${s.crystal} cristal · ${s.deuterium} deutérium`,
`<input id="count_${k}" type="number" min="1" max="20" value="1"><button onclick="buildShip('${k}')">Construire</button>`);
}).join("")+"</div></div>"+queueHTML();
}
function defense(){
let p=planet();
return `<div class="panel"><h2>🛡️ Défenses planétaires</h2><div class="grid">`+
Object.keys(defenses).map(k=>{
let d=defenses[k];
return card(d.name,`Possédées : ${p.defenses[k]}<br>Coût : ${d.metal} métal · ${d.crystal} cristal · ${d.deuterium} deutérium`,
`<button onclick="buildDefense('${k}')">Construire</button>`);
}).join("")+"</div></div>"+queueHTML();
}
function galaxy(){
return `<div class="panel"><h2>🌌 Carte galactique</h2><p>Explorez les systèmes stellaires et découvrez de nouvelles planètes.</p><div class="grid">`+
worlds.filter(w=>w.id!=="NOVA-01").map(w=>{
let found=game.discovered.includes(w.id),owned=game.planets.some(x=>x.id===w.id);
let action=owned?`<span class="good">Planète colonisée</span>`:found?
`<button onclick="colonize('${w.id}')">Coloniser (OR-3)</button>`:
`<button onclick="explore('${w.id}')">Explorer — ${w.cost} métal</button>`;
return card("🪐 "+w.name,`Coordonnées : ${w.coord}<br>Système : ${w.system}<br>${found?"Découverte":"Inexplorée"}`,action);
}).join("")+"</div></div>"+queueHTML();
}
function empire(){
return `<div class="panel"><h2>🏛️ Empire galactique</h2><p>Vos planètes et colonies.</p><div class="grid">`+
game.planets.map(p=>card("🌍 "+p.id,`Population : ${fmt(p.population)}<br>Métal : ${fmt(p.metal)}<br>Cristal : ${fmt(p.crystal)}<br>Deutérium : ${fmt(p.deuterium)}`,
`<button onclick="selected='${p.id}';render()">Sélectionner cette planète</button>`)).join("")+"</div></div>";
}
function transport(){
let p=planet(),others=game.planets.filter(x=>x.id!==p.id);
return `<div class="panel"><h2>📦 Transport interplanétaire</h2><p>Transporteurs disponibles : ${p.ships.OR4}</p>`+
(others.length?`<h3>Destination</h3><select id="targetPlanet">${others.map(x=>`<option value="${x.id}">${x.id}</option>`).join("")}</select>
<div class="grid"><div><label>Métal</label><input id="cargoMetal" type="number" min="0" value="0"></div>
<div><label>Cristal</label><input id="cargoCrystal" type="number" min="0" value="0"></div>
<div><label>Deutérium</label><input id="cargoDeut" type="number" min="0" value="0"></div></div>
<button onclick="sendTransport()">Envoyer le transport (15 sec)</button>`:"<p>Vous devez posséder au moins deux planètes pour transporter des ressources.</p>")+
(game.transports.length?`<h3>Transports en cours</h3>`+game.transports.map(t=>`<p>${t.from} → ${t.to} : ${Math.ceil(t.remaining)} sec</p>`).join(""):"")+"</div>";
}
function missions(){
let p=planet();
return `<div class="panel"><h2>⚔️ Missions militaires</h2><p>Envoyez vos OR-2 attaquer un avant-poste pirate. Les pertes sont possibles.</p>
<p>Intercepteurs disponibles : ${p.ships.OR2}</p><label>Nombre de vaisseaux</label><input id="attackCount" type="number" min="1" max="${Math.max(1,p.ships.OR2)}" value="1">
<button onclick="sendMission()">Lancer une mission (20 sec)</button>
${game.missions.length?`<h3>Missions en cours</h3>`+game.missions.map(m=>`<p>${m.planet} : ${Math.ceil(m.remaining)} sec</p>`).join(""):""}</div>`;
}
function logs(){
return `<div class="panel"><h2>📜 Journal de bord</h2>${game.logs.map(x=>`<div class="log">${x}</div>`).join("")}</div>`;
}
function render(){
renderResources();renderNav();
let pages={home,buildings,research,fleet,defense,galaxy,empire,transport,missions,logs};
$("app").innerHTML=(pages[tab]||home)();
}
setInterval(tick,1000);
render();
window.addEventListener("beforeunload",save);
</script>
</body>
</html>
