
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROJET ORION</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030813;color:#dceaff;font-family:Arial,sans-serif;overflow:hidden}
button{background:#102b48;color:#d9edff;border:1px solid #28618c;border-radius:5px;padding:8px 10px;font-size:12px;cursor:pointer}
button:active{background:#23618b}
button:disabled{opacity:.35}
#top{position:absolute;top:0;left:0;right:0;z-index:5;background:#061323eF;border-bottom:1px solid #245078;padding:7px;display:flex;justify-content:space-around;gap:5px;flex-wrap:wrap;font-size:11px}
.res{white-space:nowrap}
#title{position:absolute;top:48px;left:10px;z-index:3;font-size:17px;font-weight:bold;letter-spacing:3px;color:#7dd3fc;text-shadow:0 0 12px #168acb}
#scene{position:absolute;inset:0}
#menu{position:absolute;z-index:4;top:82px;left:8px;width:155px;max-height:calc(100% - 100px);overflow:auto;background:#07182ddd;border:1px solid #245078;border-radius:7px;padding:7px}
#menu button{width:100%;margin:2px 0;text-align:left}
#panel{position:absolute;z-index:4;right:8px;top:82px;width:min(270px,48vw);max-height:calc(100% - 100px);overflow:auto;background:#07182deF;border:1px solid #245078;border-radius:7px;padding:10px;font-size:12px}
#panel h3{margin:2px 0 10px;color:#7dd3fc;font-size:15px}
#panel h4{color:#8ecbff;margin:12px 0 5px}
.item{border-bottom:1px solid #203c57;padding:7px 0}
.item button{margin-top:5px}
.small{font-size:10px;color:#9bb4ce}
#bottom{position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:95%}
#bottom button{background:#0a2440eF}
#toast{position:absolute;z-index:8;bottom:65px;left:50%;transform:translateX(-50%);background:#0d2948;border:1px solid #3982b8;border-radius:6px;padding:10px 15px;display:none;font-size:12px;max-width:90%;text-align:center}
#missions{font-size:11px;color:#b9d7f2}
#groundControls{display:none;position:absolute;z-index:5;bottom:75px;left:12px;gap:5px}
#groundControls button{width:42px;height:42px;font-size:16px}
#footer{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#52728e;font-size:9px;padding:3px;pointer-events:none}
@media(max-width:600px){
 #menu{width:125px;top:78px;padding:5px}
 #panel{top:78px;width:calc(100% - 145px);max-height:58vh;padding:7px}
 #menu button{font-size:10px;padding:7px 5px}
 #top{font-size:10px}
 #title{font-size:14px;top:48px}
}
</style>
</head>
<body>
<div id="top">
 <span class="res">🔩 <b id="metal">10000</b></span>
 <span class="res">💎 <b id="crystal">10000</b></span>
 <span class="res">☢ <b id="deut">0</b></span>
 <span class="res">⚡ <b id="energy">0</b></span>
 <span class="res">👥 <b id="population">250</b></span>
</div>
<div id="title">PROJET ORION</div>
<div id="scene"></div>
<div id="menu">
 <button onclick="showSpace()">🌌 Univers</button>
 <button onclick="showGalaxy()">🪐 Carte galactique</button>
 <button onclick="showBuildings()">🏗 Constructions</button>
 <button onclick="showResearch()">🔬 Laboratoire</button>
 <button onclick="showShips()">🚀 Chantier spatial</button>
 <button onclick="showDefense()">🛡 Défenses</button>
 <button onclick="showColonies()">🌍 Colonies</button>
 <button onclick="showMissions()">🛰 Missions et flottes</button>
 <button onclick="goGround()">🧑‍🚀 Exploration au sol</button>
 <button onclick="showStats()">📊 Empire</button>
</div>
<div id="panel">
 <h3>POSTE DE COMMANDEMENT</h3>
 <p>Bienvenue dans le système Solaria.</p>
 <p class="small">Sélectionne une planète ou un menu pour commencer.</p>
 <div id="missions"></div>
</div>
<div id="groundControls">
 <button onpointerdown="move('forward')" onpointerup="stopMove()" onpointerleave="stopMove()">▲</button>
 <button onpointerdown="move('left')" onpointerup="stopMove()" onpointerleave="stopMove()">◀</button>
 <button onpointerdown="move('back')" onpointerup="stopMove()" onpointerleave="stopMove()">▼</button>
 <button onpointerdown="move('right')" onpointerup="stopMove()" onpointerleave="stopMove()">▶</button>
</div>
<div id="bottom">
 <button onclick="zoom(1)">＋ Zoom</button>
 <button onclick="zoom(-1)">－ Zoom</button>
 <button onclick="focusHome()">⌂ NOVA-01</button>
 <button onclick="goOrbit()">↗ Orbite</button>
</div>
<div id="toast"></div>
<div id="footer">PROJET ORION • Prototype spatial • Sauvegarde locale automatique</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =====================================================
   PROJET ORION — UNIVERS ET DONNÉES
===================================================== */
const $=id=>document.getElementById(id);
const names=["NOVA-01","LYRA-02","VEGA-03","ORION-04","ZENITH-05","TITAN-06","ECLIPSE-07"];
const planetInfo=[
 {name:"NOVA-01",system:"Solaria",coord:"1:1:1",type:"Planète tellurique",color:0x2584b8,owned:true},
 {name:"LYRA-02",system:"Solaria",coord:"1:1:2",type:"Planète rocheuse",color:0xb58a65},
 {name:"VEGA-03",system:"Solaria",coord:"1:1:3",type:"Planète désertique",color:0xc8a45e},
 {name:"ORION-04",system:"Solaria",coord:"1:2:1",type:"Planète océanique",color:0x277d9b},
 {name:"ZENITH-05",system:"Solaria",coord:"1:2:2",type:"Planète glacée",color:0x9bc8df},
 {name:"TITAN-06",system:"Solaria",coord:"1:2:3",type:"Lune minérale",color:0x807b83},
 {name:"ECLIPSE-07",system:"Solaria",coord:"1:3:1",type:"Planète volcanique",color:0xa84c38}
];
const buildingDefs={
 mine:{name:"Mine de métal",cost:[500,200,0],base:5,desc:"Produit du métal."},
 crystal:{name:"Mine de cristal",cost:[700,400,0],base:3,desc:"Produit du cristal."},
 solar:{name:"Centrale solaire",cost:[400,300,0],base:0,desc:"Augmente la production énergétique."},
 deut:{name:"Extracteur de deutérium",cost:[900,700,0],base:2,desc:"Produit du deutérium."},
 habitat:{name:"Habitat",cost:[600,500,0],base:0,desc:"Augmente la capacité de population."},
 lab:{name:"Laboratoire",cost:[1000,800,0],base:0,desc:"Permet les recherches."},
 hangar:{name:"Hangar spatial",cost:[1200,900,100],base:0,desc:"Permet de construire des vaisseaux."}
};
const shipDefs={
 scout:{name:"OR-1 Éclaireur",cost:[300,200,0],time:5,desc:"Exploration et reconnaissance."},
 fighter:{name:"OR-2 Intercepteur",cost:[600,300,100],time:8,desc:"Combat spatial."},
 colonizer:{name:"OR-3 Colonisateur",cost:[1500,1000,500],time:12,desc:"Colonisation de planètes."},
 transport:{name:"OR-4 Transporteur",cost:[900,600,200],time:9,desc:"Transport de ressources."}
};
const researchDefs={
 energy:{name:"Technologie énergétique",cost:[500,500,0],desc:"Améliore la production énergétique."},
 propulsion:{name:"Propulsion",cost:[700,500,100],desc:"Améliore les déplacements."},
 weapons:{name:"Armement",cost:[800,700,100],desc:"Augmente la puissance de combat."},
 shield:{name:"Boucliers",cost:[700,800,100],desc:"Renforce les défenses."},
 exploration:{name:"Astro-navigation",cost:[1000,900,200],desc:"Débloque l'exploration avancée."}
};
const defenseDefs={
 turret:{name:"Tourelle laser",cost:[500,300,0],desc:"Défense contre les attaques."},
 shield:{name:"Bouclier planétaire",cost:[1200,900,300],desc:"Protège la colonie."}
};
const freshPlanet=()=>({metal:10000,crystal:10000,deut:0,energy:0,population:250,buildings:{mine:0,crystal:0,solar:0,deut:0,habitat:0,lab:0,hangar:0},ships:{scout:0,fighter:0,colonizer:0,transport:0},defenses:{turret:0,shield:0}});
let game={
 version:2,selected:0,mode:"space",resources:null,
 planets:planetInfo.map((p,i)=>({ ...freshPlanet(),owned:i===0,discovered:i===0,name:p.name })),
 research:{energy:0,propulsion:0,weapons:0,shield:0,exploration:0},
 queue:[],missions:[],completed:0,credits:0,last:Date.now()
};
function loadGame(){
 try{
  let old=JSON.parse(localStorage.getItem("orionComplete")||"null");
  if(old && old.version===2){
   game={...game,...old};
   if(!Array.isArray(game.planets))game.planets=[];
   while(game.planets.length<planetInfo.length)game.planets.push({...freshPlanet(),owned:false,discovered:false});
  }else{
   let legacy=JSON.parse(localStorage.getItem("orionSave")||"null");
   if(legacy){
    const r=legacy.resources||legacy;
    if(r.metal!==undefined)game.planets[0].metal=r.metal;
    if(r.crystal!==undefined)game.planets[0].crystal=r.crystal;
    if(r.deut!==undefined)game.planets[0].deut=r.deut;
   }
  }
 }catch(e){console.log("Nouvelle sauvegarde");}
}
function save(){
 game.last=Date.now();
 localStorage.setItem("orionComplete",JSON.stringify(game));
}
loadGame();
let current=()=>game.planets[game.selected]||game.planets[0];
function notify(t){
 $("toast").textContent=t;$("toast").style.display="block";
 clearTimeout(notify.timer);notify.timer=setTimeout(()=>$("toast").style.display="none",2600);
}
function fmt(n){return Math.floor(n||0).toLocaleString("fr-FR")}
function costText(c){return `🔩 ${fmt(c[0])} · 💎 ${fmt(c[1])} · ☢ ${fmt(c[2])}`}
function canPay(c,p=current()){return p.metal>=c[0]&&p.crystal>=c[1]&&p.deut>=c[2]}
function pay(c,p=current()){if(!canPay(c,p))return false;p.metal-=c[0];p.crystal-=c[1];p.deut-=c[2];return true}
function updateUI(){
 let p=current();
 $("metal").textContent=fmt(p.metal);$("crystal").textContent=fmt(p.crystal);
 $("deut").textContent=fmt(p.deut);$("energy").textContent=fmt(p.energy);
 $("population").textContent=fmt(p.population);
 $("missions").innerHTML=`<p>Planète : ${p.name}</p><p>Constructions : ${game.queue.length}</p><p>Missions actives : ${game.missions.length}</p>`;
 save();
}
function production(){
 game.planets.forEach(p=>{
  if(!p.owned)return;
  const b=p.buildings;
  p.metal+=b.mine*buildingDefs.mine.base*(1+b.mine*.12);
  p.crystal+=b.crystal*buildingDefs.crystal.base*(1+b.crystal*.12);
  p.deut+=b.deut*buildingDefs.deut.base;
  p.energy=Math.max(0,b.solar*20*(1+game.research.energy*.1)-(b.mine*2+b.crystal*2+b.deut*3));
  p.population=Math.min(250+b.habitat*500,p.population+.02);
 });
}
function tick(){
 const now=Date.now();
 game.queue.forEach(q=>q.remaining-=1);
 let done=game.queue.filter(q=>q.remaining<=0);
 game.queue=game.queue.filter(q=>q.remaining>0);
 done.forEach(q=>{
  const p=game.planets[q.planet];
  if(q.type==="building")p.buildings[q.id]++;
  if(q.type==="ship")p.ships[q.id]++;
  if(q.type==="research")game.research[q.id]++;
  if(q.type==="defense")p.defenses[q.id]++;
  notify(`${q.name} terminé sur ${p.name}`);
 });
 game.missions.forEach(m=>m.remaining-=1);
 const arrived=game.missions.filter(m=>m.remaining<=0);
 game.missions=game.missions.filter(m=>m.remaining>0);
 arrived.forEach(m=>resolveMission(m));
 production();updateUI();
}
function addQueue(type,id,planetIndex=game.selected){
 const p=game.planets[planetIndex];
 if(game.queue.length>=3){notify("File de construction pleine : maximum 3.");return}
 let def=type==="building"?buildingDefs[id]:type==="ship"?shipDefs[id]:type==="research"?researchDefs[id]:defenseDefs[id];
 if(!def)return;
 if(type==="research"&&game.research[id]>=10){notify("Niveau maximum atteint.");return}
 if(!pay(def.cost,p)){notify("Ressources insuffisantes.");return}
 let level=type==="research"?game.research[id]:type==="building"?p.buildings[id]:0;
 let time=type==="ship"?def.time:Math.max(3,Math.round(5+level*2));
 game.queue.push({type,id,planet:planetIndex,name:def.name,remaining:time});
 notify(`${def.name} ajouté à la file (${time} s).`);
 renderCurrent();updateUI();
}

/* =====================================================
   INTERFACE DE JEU
===================================================== */
function panel(html){$("panel").innerHTML=html}
function showSpace(){
 game.mode="space";$("groundControls").style.display="none";
 spaceGroup.visible=true;groundGroup.visible=false;
 camera.position.set(0,100,270);camera.lookAt(0,0,0);
 panel(`<h3>UNIVERS DE SOLARIA</h3><p>Explorez un univers composé de planètes et de systèmes stellaires.</p><p class="small">Faites glisser pour tourner la caméra. Touchez une planète pour la sélectionner.</p><button onclick="focusHome()">Centrer NOVA-01</button>`);
 save();
}
function showGalaxy(){
 let html=`<h3>CARTE GALACTIQUE</h3><p class="small">Système Solaria • Secteur 1</p>`;
 planetInfo.forEach((pl,i)=>{
  let p=game.planets[i];
  html+=`<div class="item"><b>${pl.name}</b> <span class="small">[${pl.coord}]</span><br>${pl.type}<br><span class="small">${p.owned?"Colonie contrôlée":p.discovered?"Planète découverte":"Inexplorée"}</span><br><button onclick="selectPlanet(${i})">Sélectionner</button></div>`;
 });
 panel(html);
}
function selectPlanet(i){
 game.selected=i;let p=game.planets[i];showGalaxy();
 if(p.discovered)focusPlanet(i);else notify("Planète non découverte : envoyez une mission d'exploration.");
 updateUI();
}
function showBuildings(){
 let p=current();let html=`<h3>CONSTRUCTIONS • ${p.name}</h3><p class="small">Niveau des installations • File maximum : 3</p>`;
 Object.entries(buildingDefs).forEach(([id,d])=>{
  html+=`<div class="item"><b>${d.name}</b><br>Niveau ${p.buildings[id]}<br><span class="small">${d.desc}</span><br><span class="small">${costText(d.cost)}</span><br><button onclick="build('${id}')">Construire • ${Math.max(3,5+p.buildings[id]*2)} s</button></div>`;
 });
 html+=queueHTML();panel(html);
}
function build(id){addQueue("building",id)}
function showResearch(){
 let html=`<h3>LABORATOIRE</h3><p class="small">Développez les technologies de votre civilisation.</p>`;
 Object.entries(researchDefs).forEach(([id,d])=>{
  html+=`<div class="item"><b>${d.name}</b><br>Niveau ${game.research[id]} / 10<br><span class="small">${d.desc}</span><br><span class="small">${costText(d.cost)}</span><br><button onclick="research('${id}')">Rechercher</button></div>`;
 });
 html+=queueHTML();panel(html);
}
function research(id){if(current().buildings.lab<1){notify("Construisez d'abord un laboratoire.");return}addQueue("research",id)}
function showShips(){
 let p=current();let html=`<h3>CHANTIER SPATIAL</h3><p class="small">Flotte disponible sur ${p.name}</p>`;
 Object.entries(shipDefs).forEach(([id,d])=>{
  html+=`<div class="item"><b>${d.name}</b><br>Possédés : ${p.ships[id]}<br><span class="small">${d.desc}</span><br><span class="small">${costText(d.cost)}</span><br><button onclick="buildShip('${id}')">Construire • ${d.time} s</button></div>`;
 });
 html+=queueHTML();panel(html);
}
function buildShip(id){if(current().buildings.hangar<1){notify("Construisez d'abord un hangar spatial.");return}addQueue("ship",id)}
function showDefense(){
 let p=current();let html=`<h3>DÉFENSE PLANÉTAIRE</h3>`;
 Object.entries(defenseDefs).forEach(([id,d])=>{
  html+=`<div class="item"><b>${d.name}</b><br>Installations : ${p.defenses[id]}<br><span class="small">${d.desc}</span><br>${costText(d.cost)}<br><button onclick="buildDefense('${id}')">Construire</button></div>`;
 });
 panel(html);
}
function buildDefense(id){addQueue("defense",id)}
function showColonies(){
 let html=`<h3>COLONIES</h3>`;
 game.planets.forEach((p,i)=>{
  if(p.owned)html+=`<div class="item"><b>${p.name}</b><br>🔩 ${fmt(p.metal)} · 💎 ${fmt(p.crystal)}<br>Population : ${fmt(p.population)}<br><button onclick="selectOwned(${i})">Gérer cette colonie</button></div>`;
 });
 html+=`<p class="small">Pour fonder une colonie, découvrez une planète et envoyez un OR-3 Colonisateur.</p>`;
 panel(html);
}
function selectOwned(i){game.selected=i;updateUI();showBuildings();focusPlanet(i)}
function showMissions(){
 let p=current();
 let html=`<h3>MISSIONS ET FLOTTES</h3><p>Depuis ${p.name}</p>`;
 html+=`<div class="item"><b>Exploration</b><br>Envoyer un OR-1 vers une planète inconnue.<br><button onclick="exploreSelected()">Explorer la planète sélectionnée</button></div>`;
 html+=`<div class="item"><b>Colonisation</b><br>Envoyer un OR-3 vers une planète découverte.<br><button onclick="colonizeSelected()">Coloniser la planète sélectionnée</button></div>`;
 html+=`<div class="item"><b>Raid spatial</b><br>Envoyer des OR-2 combattre des pirates.<br><button onclick="pirateMission()">Attaquer les pirates (1 OR-2)</button></div>`;
 html+=`<div class="item"><b>Transport</b><br>Envoyer des ressources vers une colonie.<br><button onclick="transportMission()">Transporter 500 métal et 300 cristal</button></div>`;
 html+=`<h4>Flottes en mission</h4>`;
 if(!game.missions.length)html+=`<p class="small">Aucune mission en cours.</p>`;
 game.missions.forEach(m=>html+=`<div class="item">${m.label}<br>Arrivée dans ${Math.max(0,m.remaining)} s</div>`);
 html+=queueHTML();panel(html);
}
function queueHTML(){
 if(!game.queue.length)return "";
 return `<h4>File de production</h4>`+game.queue.map(q=>`<div class="item">${q.name} • ${Math.max(0,q.remaining)} s</div>`).join("");
}
function showStats(){
 let owned=game.planets.filter(p=>p.owned).length;
 let ships=game.planets.reduce((a,p)=>a+Object.values(p.ships).reduce((x,y)=>x+y,0),0);
 panel(`<h3>EMPIRE ORION</h3><p>Colonies : ${owned}</p><p>Planètes connues : ${game.planets.filter(p=>p.discovered).length}</p><p>Vaisseaux : ${ships}</p><p>Missions terminées : ${game.completed}</p><h4>Technologies</h4>${Object.entries(game.research).map(([k,v])=>`<p>${researchDefs[k].name} : niveau ${v}</p>`).join("")}<h4>Sauvegarde</h4><button onclick="saveNow()">Sauvegarder maintenant</button><button onclick="resetGame()">Réinitialiser la partie</button>`);
}
function renderCurrent(){if($("panel").innerHTML.includes("CONSTRUCTIONS"))showBuildings()}
function saveNow(){save();notify("Partie sauvegardée sur cet appareil.")}
function resetGame(){if(!confirm("Effacer toute la progression et recommencer ?"))return;localStorage.removeItem("orionComplete");location.reload()}

/* =====================================================
   MISSIONS SPATIALES
===================================================== */
function addMission(m){game.missions.push(m);notify("Mission lancée : "+m.label);showMissions();updateUI()}
function exploreSelected(){
 let p=current(),target=game.selected;
 if(target===0){notify("NOVA-01 est déjà connue.");return}
 if(!p.ships.scout){notify("Il faut au moins un OR-1 Éclaireur.");return}
 if(!pay([100,50,0])){notify("Il faut 100 métal et 50 cristal.");return}
 p.ships.scout--;
 addMission({type:"explore",target,planet:game.selected,label:"Exploration de "+planetInfo[target].name,remaining:10+game.research.exploration*2});
}
function colonizeSelected(){
 let p=current(),target=game.selected;
 if(target===0||game.planets[target].owned){notify("Cette planète ne peut pas être colonisée.");return}
 if(!game.planets[target].discovered){notify("Explorez d'abord cette planète.");return}
 if(!p.ships.colonizer){notify("Il faut un OR-3 Colonisateur.");return}
 p.ships.colonizer--;
 addMission({type:"colonize",target,planet:game.selected,label:"Colonisation de "+planetInfo[target].name,remaining:15});
}
function pirateMission(){
 let p=current();
 if(!p.ships.fighter){notify("Il faut un OR-2 Intercepteur.");return}
 p.ships.fighter--;
 addMission({type:"pirate",target:game.selected,planet:game.selected,label:"Combat contre des pirates",remaining:20});
}
function transportMission(){
 let p=current();
 let destinations=game.planets.map((x,i)=>x.owned&&i!==game.selected?i:-1).filter(i=>i>=0);
 if(!destinations.length){notify("Vous devez posséder une autre colonie.");return}
 if(!p.ships.transport){notify("Il faut un OR-4 Transporteur.");return}
 if(!pay([500,300,0])){notify("Ressources insuffisantes.");return}
 let target=destinations[0];p.ships.transport--;
 addMission({type:"transport",target,planet:game.selected,label:"Transport vers "+game.planets[target].name,remaining:15,metal:500,crystal:300});
}
function resolveMission(m){
 let origin=game.planets[m.planet],target=game.planets[m.target];
 if(m.type==="explore"){
  target.discovered=true;
  let reward=400+Math.floor(Math.random()*500);
  origin.metal+=reward;origin.crystal+=200;
  origin.ships.scout++;
  notify(`${target.name} découverte ! Récompense : ${reward} métal.`);
  focus
